[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tierwright"
version = "0.1.0"
description = "Goal-driven agent infrastructure: code does the routine work, the right-sized model does the judgment, and every output is validated."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
api = ["anthropic>=2"]
dev = ["pytest>=7"]

[project.scripts]
tierwright = "tierwright.cli:main"
tw = "tierwright.cli:main"

[tool.setuptools.packages.find]
include = ["tierwright*"]

[tool.setuptools.package-data]
tierwright = ["templates/*", "templates/roles/*", "templates/agents/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
